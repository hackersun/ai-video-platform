groups:
  - name: ai-video-commercial
    rules:
      - alert: AiVideoApiUnavailable
        expr: up{job="ai-video-api"} == 0
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "AI 视频 API 无法采集"
          description: "监控连续 2 分钟无法读取 API 指标。"
          action: "停止扩流，检查 API 存活状态、网络和运营监控凭证。"

      - alert: AiVideoDatabaseNotReady
        expr: ai_video_database_ready == 0
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "生产数据库不可用"
          description: "API 可以响应，但数据库健康检查连续 2 分钟失败。"
          action: "停止新任务，保留请求编号，检查数据库并准备回滚或恢复。"

      - alert: AiVideoHighServerErrorRate
        expr: sum(rate(ai_video_http_requests_total{status="5xx"}[5m])) / clamp_min(sum(rate(ai_video_http_requests_total[5m])), 0.001) > 0.10
        for: 5m
        labels:
          severity: P0
        annotations:
          summary: "接口服务端错误率超过 10%"
          description: "最近 5 分钟服务端错误比例持续超过发布红线。"
          action: "停止扩流，按路由和请求编号聚类错误，判断回滚或修复依赖。"

      - alert: AiVideoDeadLetterTasks
        expr: sum(ai_video_task_queue_depth{status="dead_letter"}) > 0
        for: 1m
        labels:
          severity: P1
        annotations:
          summary: "存在无法自动恢复的任务"
          description: "持久任务队列出现死信任务。"
          action: "暂停同类批量任务，核对供应商状态、账务预扣和安全重试动作。"

      - alert: AiVideoTasksNeedAttention
        expr: sum(ai_video_task_queue_depth{status="needs_attention"}) > 0
        for: 1m
        labels:
          severity: P1
        annotations:
          summary: "存在需要人工确认的任务"
          description: "供应商结果不确定，系统禁止自动重复提交。"
          action: "暂停同类任务，按任务 ID 到供应商侧确认后再执行页面建议动作。"

      - alert: AiVideoStalledTasks
        expr: ai_video_task_oldest_active_age_seconds > 900
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "任务超过 15 分钟没有推进"
          description: "最早的排队、运行或等待重试任务已超过 15 分钟。"
          action: "检查 worker、租约和供应商轮询，不要直接重复发起付费任务。"
