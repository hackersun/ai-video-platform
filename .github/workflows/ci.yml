name: CI/CD Pipeline

on:
  push:
    branches: [ main, releases, dev ]
  pull_request:
    branches: [ main, releases, dev ]

jobs:
  commercial-release-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate commercial release evidence
      env:
        TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
      run: >-
        python3 scripts/verify_commercial_release.py
        --target-branch "$TARGET_BRANCH"
        --source-branch "$SOURCE_BRANCH"
        --event-name "$EVENT_NAME"

  code-health:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend compiler dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Generate code health report
      run: python3 tools/code_health/check.py --report-only --json-report /tmp/ai-video-code-health.json

    - name: Enforce code health ratchet
      run: python3 tools/code_health/check.py --policy tools/code_health/policy.json --baseline tools/code_health/baseline.json

    - name: Upload code health report
      uses: actions/upload-artifact@v7
      with:
        name: code-health-report
        path: /tmp/ai-video-code-health.json

  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install media runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
        ffmpeg -version
        ffprobe -version

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock
        pip install pytest==9.1.1 pytest-asyncio==1.3.0 pytest-cov==7.0.0

    - name: Run tests
      working-directory: ./backend
      run: |
        test_db=$(mktemp /tmp/ai-video-platform-ci-XXXXXX.db)
        trap 'rm -f "$test_db"' EXIT
        DATABASE_URL="sqlite+aiosqlite:///$test_db" \
          E2E_REQUIRE_ISOLATED_DB=true \
          pytest --cov=app --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./backend/coverage.xml

  postgres-contract:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock
        pip install pytest==9.1.1 pytest-asyncio==1.3.0

    - name: Upgrade PostgreSQL schema
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        DEV_MODE: "true"
      run: python scripts/upgrade_database.py

    - name: Run PostgreSQL contract
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        DEV_MODE: "true"
      run: pytest -q tests/test_postgresql_runtime_contract.py tests/test_script_chapter_lineage_migration.py

  operations-recovery:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recovery_source
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install recovery test dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.lock
        pip install pytest==9.1.1 pytest-asyncio==1.3.0

    - name: Build pinned PostgreSQL 15 recovery image
      run: docker build -f infra/docker/postgres-recovery.Dockerfile -t ai-video-postgres-recovery:ci .

    - name: Upgrade source database and write recovery canary
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recovery_source
        DEV_MODE: "true"
        POSTGRES_RECOVERY_CANARY: commercial-recovery-${{ github.sha }}
      run: |
        python scripts/upgrade_database.py
        docker run --rm --network host -i \
          -e PGPASSWORD=postgres \
          postgres:15.13-alpine \
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
        CREATE TABLE recovery_drill_canary (id INTEGER PRIMARY KEY, value TEXT NOT NULL);
        INSERT INTO recovery_drill_canary (id, value) VALUES (1, '${POSTGRES_RECOVERY_CANARY}');
        SQL

    - name: Back up and restore into isolated drill database
      working-directory: ./backend
      env:
        SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recovery_source
        RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_video_restore_drill
        RELEASE_SHA: ${{ github.sha }}
      run: |
        backup_dir=$(mktemp -d /tmp/ai-video-recovery-XXXXXX)
        docker run --rm --network host \
          --user "$(id -u):$(id -g)" \
          --volume "$backup_dir:/backups" \
          ai-video-postgres-recovery:ci \
          /app/scripts/backup_postgres.py \
          --database-url "$SOURCE_DATABASE_URL" \
          --output-dir /backups \
          --label ci-recovery \
          --release-sha "$RELEASE_SHA"
        archive=$(find "$backup_dir" -maxdepth 1 -name '*.dump' -type f -print -quit)
        test -n "$archive"
        docker run --rm --network host \
          -e PGPASSWORD=postgres \
          postgres:15.13-alpine \
          createdb --host localhost --username postgres ai_video_restore_drill
        docker run --rm --network host \
          --user "$(id -u):$(id -g)" \
          --volume "$backup_dir:/backups:ro" \
          ai-video-postgres-recovery:ci \
          /app/scripts/restore_postgres.py \
          --database-url "$RESTORE_DATABASE_URL" \
          --archive "/backups/$(basename "$archive")" \
          --manifest "/backups/$(basename "${archive}.json")" \
          --confirm-target ai_video_restore_drill
        cp "${archive}.json" /tmp/postgres-recovery-manifest.json

    - name: Verify restored data and migration head
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_video_restore_drill
        DEV_MODE: "true"
        RUN_POSTGRES_RECOVERY_DRILL: "true"
        POSTGRES_RECOVERY_CANARY: commercial-recovery-${{ github.sha }}
      run: pytest -q tests/test_postgres_recovery_runtime.py

    - name: Validate monitoring rules and Compose overlay
      env:
        IMAGE_TAG: latest
        POSTGRES_PASSWORD: ci-only-password
        DATABASE_URL: postgresql://ai_video:ci-only-password@postgres:5432/ai_video_platform
        REDIS_PASSWORD: ci-only-password
        REDIS_URL: redis://:ci-only-password@redis:6379/0
        FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        JWT_SECRET_KEY: ci-jwt-secret-that-is-definitely-long-enough
        OBJECT_STORAGE_PROVIDER: qiniu
        AUTH_EMAIL_PROVIDER: smtp
        SMTP_HOST: smtp.example.test
        SMTP_USERNAME: ci-mailer
        SMTP_PASSWORD: ci-only-password
        AUTH_EMAIL_FROM: no-reply@example.test
        PUBLIC_APP_URL: http://127.0.0.1:3000
        CUSTOMER_BILLING_MODE: enforced
        OPERATIONS_TOKEN: ci-operations-token-that-is-long-enough
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      run: |
        monitoring_dir=$(mktemp -d /tmp/ai-video-monitoring-XXXXXX)
        printf '%s' "$OPERATIONS_TOKEN" > "$monitoring_dir/operations-token"
        cp infra/monitoring/alertmanager.yml.example "$monitoring_dir/alertmanager.yml"
        docker run --rm \
          -v "$PWD/infra/monitoring:/etc/prometheus:ro" \
          -v "$monitoring_dir/operations-token:/run/secrets/operations_token:ro" \
          --entrypoint promtool prom/prometheus:v3.5.0 \
          check config /etc/prometheus/prometheus.yml
        OPERATIONS_TOKEN_FILE="$monitoring_dir/operations-token" \
          ALERTMANAGER_CONFIG_FILE="$monitoring_dir/alertmanager.yml" \
          docker compose -f infra/compose/production.yml -f infra/compose/monitoring.yml config --quiet

    - name: Upload recovery manifest
      uses: actions/upload-artifact@v7
      with:
        name: postgres-recovery-manifest
        path: /tmp/postgres-recovery-manifest.json

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run TypeScript check
      working-directory: ./frontend
      run: npm run typecheck
    
    - name: Build
      working-directory: ./frontend
      run: npm run build

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Reject tracked credentials and databases
      run: python3 tools/security/check_tracked_files.py

    - name: Audit frontend dependencies
      working-directory: ./frontend
      run: npm audit --audit-level=high

    - name: Audit backend dependencies
      run: |
        python -m pip install pip-audit==2.10.1
        python -m pip_audit -r backend/requirements.lock

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, postgres-contract, operations-recovery, frontend-tests, security-scan]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Build backend
      run: docker build -t ai-video-backend:latest ./backend
    
    - name: Build frontend
      run: docker build --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1 -t ai-video-frontend:latest ./frontend

    - name: Validate production Compose contract
      env:
        IMAGE_TAG: latest
        POSTGRES_PASSWORD: ci-only-password
        DATABASE_URL: postgresql://ai_video:ci-only-password@postgres:5432/ai_video_platform
        REDIS_PASSWORD: ci-only-password
        REDIS_URL: redis://:ci-only-password@redis:6379/0
        FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        JWT_SECRET_KEY: ci-jwt-secret-that-is-definitely-long-enough
        OBJECT_STORAGE_PROVIDER: qiniu
        AUTH_EMAIL_PROVIDER: smtp
        SMTP_HOST: smtp.example.test
        SMTP_USERNAME: ci-mailer
        SMTP_PASSWORD: ci-only-password
        AUTH_EMAIL_FROM: no-reply@example.test
        PUBLIC_APP_URL: http://127.0.0.1:3000
        CUSTOMER_BILLING_MODE: enforced
        OPERATIONS_TOKEN: ci-operations-token-that-is-long-enough
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      run: |
        docker compose -f infra/compose/production.yml config --quiet
        docker compose -f infra/compose/production.yml -f infra/compose/staging.yml config --quiet
