name: CI/CD Pipeline

on:
  push:
    branches: [ main, releases, dev, 'feat/**', 'fix/**', 'codex/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  code-health:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend compiler dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Generate code health report
      run: python3 tools/code_health/check.py --report-only --json-report /tmp/ai-video-code-health.json

    - name: Upload code health report
      uses: actions/upload-artifact@v4
      with:
        name: code-health-report
        path: /tmp/ai-video-code-health.json

  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install media runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
        ffmpeg -version
        ffprobe -version

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==9.0.2 pytest-asyncio==1.3.0 pytest-cov==7.0.0

    - name: Run tests
      working-directory: ./backend
      run: |
        test_db=$(mktemp /tmp/ai-video-platform-ci-XXXXXX.db)
        trap 'rm -f "$test_db"' EXIT
        DATABASE_URL="sqlite+aiosqlite:///$test_db" \
          E2E_REQUIRE_ISOLATED_DB=true \
          pytest --cov=app --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml

  postgres-contract:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==9.0.2 pytest-asyncio==1.3.0

    - name: Initialize PostgreSQL schema
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        DEV_MODE: "true"
      run: python init_db.py

    - name: Run PostgreSQL contract
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        DEV_MODE: "true"
      run: pytest -q tests/test_postgresql_runtime_contract.py tests/test_script_chapter_lineage_migration.py

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run TypeScript check
      working-directory: ./frontend
      run: npm run typecheck

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint
    
    - name: Build
      working-directory: ./frontend
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, postgres-contract, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend
      run: docker build -t ai-video-backend:latest ./backend
    
    - name: Build frontend
      run: docker build -t ai-video-frontend:latest ./frontend


  commercial-gates:
    name: Commercial auth/rate-limit gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==9.0.2 pytest-asyncio==1.3.0
    - name: Run commercial gate tests
      working-directory: ./backend
      env:
        RATE_LIMIT_BACKEND: memory
        REFRESH_TOKEN_STORE: memory
        ACCESS_TOKEN_EXPIRE_MINUTES: "15"
        E2E_REQUIRE_ISOLATED_DB: "true"
      run: |
        test_db=$(mktemp /tmp/ai-video-platform-ci-XXXXXX.db)
        trap 'rm -f "$test_db"' EXIT
        DATABASE_URL="sqlite+aiosqlite:///$test_db" \
          pytest -q tests/test_commercial_rate_limit.py test_auth_account.py

  commercial-novice-e2e:
    name: Commercial novice fake-mode smoke
    runs-on: ubuntu-latest
    needs: [frontend-tests, commercial-gates]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Install Playwright browser
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium
    - name: Run novice/onboarding + smoke suite
      working-directory: ./frontend
      env:
        CI: "true"
      run: npm run e2e:commercial-novice
